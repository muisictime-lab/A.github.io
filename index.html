<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김효석 | 설득강사</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
  background:linear-gradient(145deg,#081b33,#164b73);
  color:#fff;min-height:100vh;padding:20px 15px;
}
.card{
  max-width:440px;min-height:calc(100vh - 40px);margin:auto;
  padding:42px 24px 28px;border-radius:30px;
  display:flex;flex-direction:column;justify-content:space-between;
  background:rgba(255,255,255,.09);
  box-shadow:0 20px 50px rgba(0,0,0,.3);
  backdrop-filter:blur(12px);
}
.top{text-align:center}
.badge{
  display:inline-block;background:#f4c542;color:#10263f;
  padding:8px 17px;border-radius:30px;font-size:15px;
  font-weight:800;margin-bottom:18px;
}
h1{
  font-size:46px;letter-spacing:-3px;margin-bottom:10px;
}
.intro{
  font-size:21px;line-height:1.55;font-weight:600;
}
.services{margin:38px 0}
.services h2{
  text-align:center;font-size:20px;margin-bottom:18px;
  color:#dcecff;
}
.service{
  display:flex;align-items:center;gap:15px;
  background:#fff;color:#10263f;border-radius:18px;
  padding:19px 17px;margin-bottom:13px;
  font-size:20px;font-weight:800;
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}
.num{
  width:43px;height:43px;min-width:43px;
  border-radius:50%;display:grid;place-items:center;
  background:#164b73;color:#fff;font-size:18px;
}
.contact{
  display:block;text-align:center;text-decoration:none;
  background:#f4c542;color:#10263f;
  padding:19px;border-radius:17px;
  font-size:22px;font-weight:900;
  box-shadow:0 8px 20px rgba(0,0,0,.22);
  transition:.2s;
}
.contact:active{transform:scale(.97)}
.phone{
  display:block;font-size:16px;margin-top:5px;
  font-weight:700;
}
.copy{
  text-align:center;font-size:13px;
  color:#c5d7e8;margin-top:14px;
}
</style>
</head>
<body>
<main class="card">
  <section class="top">
    <div class="badge">설득강사</div>
    <h1>김효석</h1>
    <p class="intro">말에 힘을 더하고<br>설득에 스토리를 더합니다.</p>
  </section>

  <section class="services">
    <h2>강의 분야</h2>
    <div class="service">
      <span class="num">1</span>
      <span>기업체 강의</span>
    </div>
    <div class="service">
      <span class="num">2</span>
      <span>영업인 강의</span>
    </div>
    <div class="service">
      <span class="num">3</span>
      <span>AI강의 강사</span>
    </div>
  </section>

  <section>
    <a class="contact" href="tel:01012341234">
      📞 문의하기
      <span class="phone">010-1234-1234</span>
    </a>
    <p class="copy">© 김효석아카데미</p>
  </section>
</main>

<script>
document.querySelector('.contact').addEventListener('click',function(){
  console.log('김효석 강사 문의 전화 연결');
});
</script>
</body>
</html>
